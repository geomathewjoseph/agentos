<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" fill="none" aria-labelledby="agentos-title">
  <title id="agentos-title">AgentOS Logo</title>
  <defs>
    <linearGradient id="agentos-gradient" x1="4" y1="4" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="logo-soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient dark squircle background -->
  <rect width="36" height="36" rx="10" fill="#0f172a" />
  <rect x="2" y="2" width="32" height="32" rx="9" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" fill="none" />

  <!-- Autonomous Core Loop -->
  <circle cx="18" cy="18" r="5.5" stroke="url(#agentos-gradient)" stroke-width="2" stroke-linecap="round" />

  <!-- Dynamic Tri-Node Neural Swarm -->
  <circle cx="18" cy="9" r="2.2" fill="#ffffff" filter="url(#logo-soft-glow)" />
  <circle cx="10" cy="23.5" r="2.2" fill="#10b981" />
  <circle cx="26" cy="23.5" r="2.2" fill="#06b6d4" />

  <!-- Orbit Bridges connecting agent nodes -->
  <path d="M18 11.2 V12.5 M11.8 22.4 L13 21.5 M24.2 22.4 L23 21.5" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.4" stroke-linecap="round" />
</svg>
