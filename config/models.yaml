# AgentOS Model Configuration
# Providers are tried in order. First success wins.
#
# Primary: Groq (high-speed inference with active models)
# Fallback: OpenRouter free tier

models:
  planning:
    chain:
      - { provider: groq,        model: openai/gpt-oss-120b }
      - { provider: groq,        model: qwen/qwen3.8-27b }
      - { provider: groq,        model: openai/gpt-oss-20b }
      - { provider: openrouter,  model: inclusionai/ling-3.0-flash-sante:free }

